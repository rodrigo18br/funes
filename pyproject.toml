[project]
name = "funes-core"
version = "0.1.0"
readme="README.md"
authors=[
    {name="Rodrigo Oliveira", email="rodrigo18br@hotmail.com"}
]
description = "Local, offline semantic image search powered by CLIP and sqlite-vector."
requires-python = ">=3.9"
dependencies = [
    "fastembed>=0.7.0",
    "numpy>=1.24",
    "PyQt6>=6.7",
    "sqliteai-vector>=1.0.0",
]
license = "MIT"

[project.scripts]
funes-cli = "funes.cli:main"
funes = "funes.interface.application:main"

[build-system]
requires = ["uv_build>=0.11.30,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
    "pytest-qt>=4.4",
]

[project.urls]
Homepage = "https://github.com/rodrigo18br/funes"

[tool.uv.build-backend]
module-name = "funes"
